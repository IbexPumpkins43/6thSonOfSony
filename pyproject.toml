[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sixth-son-of-sony"
version = "0.1.0"
description = "A Discord music bot with YouTube, Spotify, and SoundCloud support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py==2.7.1",
    "PyNaCl==1.6.2",
    "python-dotenv==1.2.2",
    "spotipy==2.26.0",
    "yt-dlp[default]==2026.7.4",
    "bgutil-ytdlp-pot-provider==1.3.2"
]

[project.scripts]
sixth-son-of-sony = "sixth_son_of_sony.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
